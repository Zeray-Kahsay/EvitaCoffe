services:
  sql:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: EvitaCoffeeSQL
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
  
  redis:
    image: redis:7
    container_name: evita-redis
    ports:
      - "6379:6379"
  
  
    
    